<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Home</title>
<link rel="preload" href="fonts/Inter-subset.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wall">
  <script>
    // The painting's tiny blurred preview (art.js keeps it), drawn at once while the real one loads (~3 s on a cold start).
    try { var __p = localStorage.getItem('art.preview'); if (__p) document.getElementById('wall').style.backgroundImage = 'url(' + __p + ')'; } catch (e) {}
  </script>
  <div class="slide" id="s0"><img alt=""></div>
  <div class="slide" id="s1"><img alt=""></div>
</div>
<div id="shade"></div>

<div id="clock">
  <div id="time">--:--</div>
  <div id="date"></div>
  <div id="wx"><svg viewBox="0 0 24 24"></svg><span id="wx-temp"></span><span id="wx-range"></span></div>
  <div id="cal"></div>
</div>
<!-- Screensaver: a gallery label, like a museum's wall card -->
<div id="label"><div id="g-title"></div><div id="g-artist"></div><div id="g-line"></div></div>

<div id="top">
  <div class="btn" id="b-inputs" data-tip="Inputs">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="11" rx="2"/><path d="M7 20h10M8 10h8M8 13h8"/></svg>
    <svg class="on" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="11" rx="2"/><path d="M7 20h10M8 10h8M8 13h8"/></svg>
  </div>
  <div class="btn" id="b-lghome" data-tip="LG Home">
    <svg viewBox="0 0 24 24"><path d="M4 11.5L12 5l8 6.5M6.5 10v8.5h11V10"/><path d="M10 18.5v-4.5h4v4.5"/></svg>
    <svg class="on" viewBox="0 0 24 24"><path d="M4 11.5L12 5l8 6.5M6.5 10v8.5h11V10"/><path d="M10 18.5v-4.5h4v4.5"/></svg>
  </div>
  <div class="btn" id="b-settings" data-tip="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4L5.3 5.3"/></svg>
    <svg class="on" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4L5.3 5.3"/></svg>
  </div>
  <div id="picker"></div>
</div>

<!-- Continue watching, from the hub (hub/): above the dock while the hub's app is focused, like tvOS's top shelf -->
<div id="shelf"><div id="sh-title"></div><div id="sh-row"></div></div>

<div id="dock">
  <div id="glass"><div class="blur" id="g0"><canvas width="240" height="135"></canvas></div><div class="blur" id="g1"><canvas width="240" height="135"></canvas></div></div>
  <div id="row"></div>
</div>

<div id="drawer"><div id="d-title">All apps</div><div id="grid"></div></div>

<div id="caption"><div id="c-title"></div><div id="c-meta"></div></div>

<script src="config.js"></script>
<script src="config.local.js"></script>
<script src="apps.js"></script>
<script src="i18n.js"></script>
<script src="time.js"></script>
<script src="tv.js"></script>
<script src="art.js"></script>
<script src="weather.js"></script>
<script src="calendar.js"></script>
<script src="main.js"></script>
</body>
</html>
